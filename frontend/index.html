<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>金花对决 - 在线炸金花</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
</head>
<body>
    <!-- 登录/创建房间界面 -->
    <div id="lobby-screen" class="screen">
        <div class="lobby-container">
            <h1>金花对决</h1>
            <p class="subtitle">在线多人炸金花</p>

            <div class="form-group">
                <label for="nickname">昵称</label>
                <input type="text" id="nickname" placeholder="输入你的昵称" maxlength="10">
            </div>

            <div class="button-group">
                <button id="btn-create" class="btn btn-primary">创建房间</button>
            </div>

            <div class="divider">或者</div>

            <div class="form-group">
                <label for="room-id">房间号</label>
                <input type="text" id="room-id" placeholder="输入6位房间号" maxlength="6">
            </div>

            <div class="button-group">
                <button id="btn-join" class="btn btn-secondary">加入房间</button>
            </div>

            <div id="lobby-error" class="error-message"></div>
        </div>
    </div>

    <!-- 等待房间界面 -->
    <div id="waiting-screen" class="screen hidden">
        <div class="waiting-container">
            <div class="room-info">
                <span>房间号: <strong id="display-room-id"></strong></span>
                <button id="btn-copy-room" class="btn btn-small">复制</button>
            </div>

            <h2>等待玩家加入...</h2>
            <p class="hint">分享房间号给好友一起游戏</p>

            <div id="player-list" class="player-list"></div>

            <div class="waiting-actions">
                <button id="btn-start" class="btn btn-primary">开始游戏</button>
                <button id="btn-leave-waiting" class="btn btn-danger">离开房间</button>
            </div>
        </div>
    </div>

    <!-- 游戏界面 -->
    <div id="game-screen" class="screen hidden">
        <!-- 背景音乐 -->
        <audio id="bg-music" loop preload="auto">
            <source src="music/bgm.mp3" type="audio/mpeg">
        </audio>
        <button id="btn-music" class="btn-music" title="背景音乐">
            <span class="music-icon">🎵</span>
        </button>

        <!-- 顶部信息栏 -->
        <div class="game-header">
            <div class="room-info-small">
                房间: <span id="game-room-id"></span>
            </div>
            <div class="player-info">
                <span id="my-nickname"></span>
                <span class="points">积分: <span id="my-points">100</span></span>
            </div>
        </div>

        <!-- 玩家区域 -->
        <div class="players-area">
            <div id="other-players" class="other-players"></div>
        </div>

        <!-- 中央信息区 -->
        <div class="center-area">
            <div class="pot-display">
                <div class="pot-label">总积分池</div>
                <div class="pot-value" id="pot-value">0</div>
            </div>
        </div>

        <!-- 右侧底注显示 -->
        <div class="side-info">
            <div class="base-bet">
                <div class="bet-label">底注</div>
                <div class="bet-value" id="base-bet-value">0</div>
            </div>
        </div>

        <!-- 历史记录面板 -->
        <div class="history-panel">
            <div class="history-header">
                <span>历史记录</span>
                <button id="btn-toggle-history" class="btn btn-small">收起</button>
            </div>
            <div id="history-list" class="history-list"></div>
        </div>

        <!-- 手牌区域 -->
        <div class="hand-area">
            <div class="hand-label">我的手牌</div>
            <div id="my-cards" class="cards-container"></div>
        </div>

        <!-- 操作按钮区域 -->
        <div class="action-area">
            <div id="turn-indicator" class="turn-indicator hidden">轮到你操作</div>

            <div id="action-buttons" class="action-buttons">
                <!-- 闷牌按钮组 -->
                <div id="blind-bet-group" class="btn-group">
                    <button class="btn btn-action" data-action="blind" data-amount="1">闷1</button>
                    <button class="btn btn-action" data-action="blind" data-amount="2">闷2</button>
                    <button class="btn btn-action" data-action="blind" data-amount="4">闷4</button>
                </div>

                <!-- 看牌按钮 -->
                <button id="btn-look" class="btn btn-action" data-action="look">看牌</button>

                <!-- 跟牌按钮(看牌后) -->
                <button id="btn-follow" class="btn btn-action hidden" data-action="follow">跟牌</button>

                <!-- 弃牌按钮 -->
                <button id="btn-fold" class="btn btn-danger" data-action="fold">弃牌</button>

                <!-- 开牌按钮 -->
                <button id="btn-compare" class="btn btn-warning hidden" data-action="compare">开牌</button>
            </div>

            <!-- 选择比牌对象 -->
            <div id="compare-modal" class="modal hidden">
                <div class="modal-content">
                    <h3>选择比牌对象</h3>
                    <div id="compare-targets"></div>
                    <button id="btn-cancel-compare" class="btn btn-secondary">取消</button>
                </div>
            </div>
        </div>

        <!-- 游戏结束弹窗 -->
        <div id="game-over-modal" class="modal hidden">
            <div class="modal-content">
                <h2>游戏结束</h2>
                <div id="winner-info"></div>
                <div id="final-pot"></div>
                <button id="btn-new-game" class="btn btn-primary">再来一局</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
